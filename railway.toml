[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# startCommand = "php -S 0.0.0.0:8080 -t public public/debug.php"
startCommand = "php artisan config:clear && php artisan cache:clear && php artisan serve --host=0.0.0.0 --port=8080"

[environment]
APP_ENV = "local"
APP_DEBUG = "true"

# Database Configuration untuk MySQL
DB_CONNECTION = "mysql"
DB_HOST = { from = "MYSQLHOST" }
DB_PORT = { from = "MYSQLPORT" }
DB_DATABASE = { from = "MYSQLDATABASE" }
DB_USERNAME = { from = "MYSQLUSER" }
DB_PASSWORD = { from = "MYSQLPASSWORD" }
