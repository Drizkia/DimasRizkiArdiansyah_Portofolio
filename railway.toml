[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "php -S 0.0.0.0:$PORT -t public public/index.php"

[environment]
APP_ENV = "local"
APP_DEBUG = "true"

# Database Configuration untuk MySQL
DB_CONNECTION = "mysql"
DB_HOST = { from = "MYSQLHOST" }
DB_PORT = { from = "MYSQLPORT" }
DB_DATABASE = { from = "MYSQLDATABASE" }
DB_USERNAME = { from = "MYSQLUSER" }
DB_PASSWORD = { from = "MYSQLPASSWORD" }
